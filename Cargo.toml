[workspace]
resolver = "3"
members = ["crates/*"]

# Settings every crate can inherit with `edition.workspace = true`, etc.
[workspace.package]
version = "0.1.0"
edition = "2024"
license = "MIT OR Apache-2.0"

# Shared dependency versions. Crates opt in with `serde = { workspace = true }`.
[workspace.dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
uuid = { version = "1", features = ["v4", "serde"] }
chrono = { version = "0.4", features = ["serde"] }

# Internal crates
orcyn-types = { path = "crates/orcyn-types" }
