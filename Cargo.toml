[workspace]
resolver = "3"
members = ["crates/*"]

# Settings every crate can inherit with `edition.workspace = true`, etc.
[workspace.package]
version = "0.1.0"
edition = "2024"
license = "MIT OR Apache-2.0"

# Shared dependency versions. Crates opt in with `serde = { workspace = true }`.
[workspace.dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
uuid = { version = "1", features = ["v4", "serde"] }
chrono = { version = "0.4", features = ["serde"] }

# Async runtime + web server
tokio = { version = "1", features = ["full"] }
axum = "0.8"
tower-http = { version = "0.7", features = ["trace"] }

# Database
sqlx = { version = "0.9", default-features = false, features = [
    "runtime-tokio",
    "postgres",
    "macros",
    "migrate",
    "uuid",
    "chrono",
] }

# Logging
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }

# API keys: randomness + hashing
rand = "0.10"
sha2 = "0.11"
hex = "0.4"

# Command-line parsing (orcyn-admin, later orcyn-cli)
clap = { version = "4", features = ["derive", "env"] }

# Config + errors
dotenvy = "0.15"
thiserror = "2"
anyhow = "1"

# Internal crates
orcyn-types = { path = "crates/orcyn-types" }
